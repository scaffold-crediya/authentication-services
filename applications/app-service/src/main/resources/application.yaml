server:
  port: 8080
spring:
  application:
    name: "autentication-services"
  r2dbc:
    host: ${SPRING_R2DBC_HOST:localhost}
    port: ${SPRING_R2DBC_PORT:5432}
    database: ${SPRING_R2DBC_DATABASE:crediya_authentication}
    schema: public
    username: ${SPRING_R2DBC_USERNAME:jhompo}
    password: ${SPRING_R2DBC_PASSWORD:pass123}
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
security:
  jwt:
    # Genera una clave secreta segura, por ejemplo, con un generador online
    secret-key: "VGhpcy1Jcy1BLVNlY3JldC1LZXktRm9yLUpyZWRpdG9zLVNlcnZpY2U="
    # Expiración en milisegundos (ej. 1 hora)
    expiration-time: 3600000
